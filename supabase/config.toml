# Supabase CLI / GitHub integration config.
# Anything not listed uses Supabase's defaults.
# Deployed to production by the Supabase GitHub integration on every push to `main`.
# Auth settings (site URL, redirect URLs, providers) are managed in the dashboard for now.
project_id = "hippocampus-books"

[functions.search-books]
enabled = true
verify_jwt = false # checked inside the function (authError), which supports new signing keys

[functions.book-details]
enabled = true
verify_jwt = false # checked inside the function (authError), which supports new signing keys

[functions.series-books]
enabled = true
verify_jwt = false # checked inside the function (authError), which supports new signing keys
